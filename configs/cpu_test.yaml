# Lightweight CPU training configuration for local testing.

project:
  name: "moliv_rl"
  seed: 42069

paths:
  data_dir: "data"
  checkpoint_dir: "checkpoints"
  results_dir: "results"
  metrics_file: null
  plots_dir: null

data:
  dataset_type: "streaming"
  dataset_id: "OpenMOSS-Team/GameQA-140K"
  train_split: "preview"
  validation_split: "preview"
  image_size: 256
  batch_size: 1
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  max_train_samples: 128
  max_val_samples: 32

model:
  name: "classification_model"
  block_dims:
    - 32
    - 64
    - 128
  in_channels: 3
  out_channels: 256
  patch_size: 8
  dropout: 0.2
  num_classes: 30
  optimize: false

optimizer:
  name: "adamw"
  learning_rate: 0.001
  weight_decay: 0.0001

scheduler:
  name: "cosine_annealing"
  interval: "epoch"
  eta_min: 0.0

loss:
  name: "cross_entropy"
  label_smoothing: 0.0

training:
  epochs: 3
  gradient_accumulation_steps: 2
  use_amp: false
  precision_average: "macro"

runtime:
  device: "cpu"
  save_best: true
  save_last: true
